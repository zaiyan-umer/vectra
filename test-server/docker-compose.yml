services:
  backend-1:
    build: .
    environment:
      SERVER_NAME: "backend-1"
      SERVER_ADDR: "0.0.0.0:8081"
    ports:
      - "8081:8081"

  backend-2:
    build: .
    environment:
      SERVER_NAME: "backend-2"
      SERVER_ADDR: "0.0.0.0:8082"
    ports:
      - "8082:8082"

  backend-3:
    build: .
    environment:
      SERVER_NAME: "backend-3"
      SERVER_ADDR: "0.0.0.0:8083"
    ports:
      - "8083:8083"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "vectra"
      POSTGRES_USER: "vectra"
      POSTGRES_PASSWORD: "vectra_dev"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectra -d vectra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: